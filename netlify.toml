[build]
  # Build settings
  publish = "."
  command = "echo 'Static site - no build required'"

[build.environment]
  NODE_VERSION = "18"

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self'"

# Cache static assets
[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Gzip compression
[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Redirect rules
[[redirects]]
  from = "/app"
  to = "https://apps.apple.com/us/app/backupflow/id6753620051"
  status = 302

[[redirects]]
  from = "/download"
  to = "https://apps.apple.com/us/app/backupflow/id6753620051"
  status = 302

[[redirects]]
  from = "/support"
  to = "/#support"
  status = 302

[[redirects]]
  from = "/contact"
  to = "/#support"
  status = 302

[[redirects]]
  from = "/twitter"
  to = "https://twitter.com/tamersavasci"
  status = 302

[[redirects]]
  from = "/github"
  to = "https://github.com/tsavasci/BackupFlow"
  status = 302

# 404 handling
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
